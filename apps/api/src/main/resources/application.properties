spring.application.name=moto-routes-api

# Sin valores por defecto a propósito: si DB_URL/DB_USERNAME/DB_PASSWORD no están
# definidas, el arranque falla explícitamente en vez de conectar en silencio a
# algo inesperado. Las define infra/docker/docker-compose.yml para desarrollo local.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
